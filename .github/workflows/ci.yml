name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  build:
    runs-on: macos-14   # Apple Silicon runner
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: swift --version

      - name: Build app + helper
        run: make

      - name: Logic and helper safety regressions
        run: make test-logic

      - name: Verify outputs
        run: |
          test -d dist/OmniStats.app
          test -f dist/OmniStats.app/Contents/MacOS/OmniStats
          test -f dist/OmniStats.app/Contents/Resources/omnistats-smcd
          test -f build/omnistats-smcd
          test -x dist/OmniStats.app/Contents/Resources/omnistats-nettop
          # LSMinimumSystemVersion is 13.0; every binary must actually load there.
          for binary in MacOS/OmniStats Resources/omnistats-smcd Resources/omnistats-nettop; do
            otool -l "dist/OmniStats.app/Contents/$binary" | grep -A4 LC_BUILD_VERSION | grep -q "minos 13.0" \
              || { echo "::error::$binary does not target macOS 13.0"; exit 1; }
          done

      - name: Package artifact
        run: ditto -c -k --keepParent dist/OmniStats.app OmniStats.zip

      - uses: actions/upload-artifact@v4
        with:
          name: OmniStats-app
          path: OmniStats.zip
