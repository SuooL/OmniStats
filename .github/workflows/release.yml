name: Release

# Tag a commit on main as vX.Y.Z to build and publish a release.
# The zipped .app is attached as OmniStats.zip — the in-app updater downloads it.
on:
  push:
    tags: ['v*']

jobs:
  release:
    runs-on: macos-14
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Build app + helper
        run: make

      - name: Build DMG (for humans — drag to Applications)
        run: make dmg

      - name: Zip app (for the in-app updater)
        run: ditto -c -k --keepParent dist/OmniStats.app OmniStats.zip

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/OmniStats.dmg
            OmniStats.zip
          generate_release_notes: true
