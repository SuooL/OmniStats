name: Release

# Tag a commit on main as vX.Y.Z to build and publish a release.
# The zipped .app is attached as OmniStats.zip — the in-app updater downloads it.
on:
  push:
    tags: ['v*']

jobs:
  release:
    runs-on: macos-14
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Verify release version
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' packaging/Info.plist)" = "$VERSION"
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleVersion' packaging/Info.plist)" = "$VERSION"

      - name: Logic and helper safety regressions
        run: make test-logic

      # Releases are ad-hoc signed unless the optional MACOS_SIGN_P12 secrets exist
      # (see CONTRIBUTING → Release signing). With them, every release is signed
      # with that one certificate. codesign only finds identities in keychains on
      # the search list, so the temporary keychain is added to it.
      - name: Import optional release signing certificate
        env:
          MACOS_SIGN_P12: ${{ secrets.MACOS_SIGN_P12 }}
          MACOS_SIGN_P12_PASSWORD: ${{ secrets.MACOS_SIGN_P12_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${MACOS_SIGN_P12}" ] || [ -z "${MACOS_SIGN_P12_PASSWORD}" ]; then
            echo "No signing certificate configured: this release is ad-hoc signed."
            echo "SIGN_ID=-" >> "$GITHUB_ENV"
            exit 0
          fi
          KEYCHAIN="$RUNNER_TEMP/release-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          P12="$RUNNER_TEMP/release-signing.p12"
          printf '%s' "$MACOS_SIGN_P12" | base64 --decode > "$P12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$P12" -k "$KEYCHAIN" -P "$MACOS_SIGN_P12_PASSWORD" -T /usr/bin/codesign >/dev/null
          rm -f "$P12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          # Self-signed identities are untrusted, so look them up without -v.
          IDENTITY="$(security find-identity -p codesigning "$KEYCHAIN" | awk 'length($2) == 40 && $2 ~ /^[0-9A-F]+$/ { print $2; exit }')"
          test -n "$IDENTITY"
          echo "Signing identity SHA-1: $IDENTITY"
          echo "SIGN_ID=$IDENTITY" >> "$GITHUB_ENV"
          echo "SIGN_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"

      - name: Build app + helper
        run: make SIGN_ID="$SIGN_ID"

      - name: Build DMG (for humans — drag to Applications)
        run: make dmg SIGN_ID="$SIGN_ID"

      - name: Verify release signature
        run: |
          set -euo pipefail
          codesign --verify --deep --strict dist/OmniStats.app
          if [ "$SIGN_ID" = "-" ]; then echo "Ad-hoc signed release."; exit 0; fi
          for code in dist/OmniStats.app dist/OmniStats.app/Contents/Resources/omnistats-smcd; do
            REQUIREMENT="$(codesign -d -r- "$code" 2>&1 | grep 'designated' || true)"
            echo "$code: $REQUIREMENT"
            case "$REQUIREMENT" in
              *"certificate leaf = H\""*) ;;
              *) echo "::error::$code is not signed with the release certificate"; exit 1 ;;
            esac
          done

      - name: Zip app (for the Sparkle updater)
        run: ditto -c -k --keepParent dist/OmniStats.app OmniStats.zip

      # Sparkle appcast, EdDSA-signed with the private key held only as a repo secret.
      # `make` already fetched the Sparkle tools into build/sparkle/bin.
      - name: Generate signed appcast
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${SPARKLE_ED_PRIVATE_KEY}" ]; then
            echo "::error::SPARKLE_ED_PRIVATE_KEY secret is empty — run generate_keys and add it before releasing."
            exit 1
          fi
          KEY_FILE="$RUNNER_TEMP/sparkle_ed_key"
          printf '%s' "$SPARKLE_ED_PRIVATE_KEY" > "$KEY_FILE"
          mkdir -p appcast-src && cp OmniStats.zip appcast-src/
          build/sparkle/bin/generate_appcast \
            --ed-key-file "$KEY_FILE" \
            --download-url-prefix "https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/" \
            -o appcast.xml \
            appcast-src
          rm -f "$KEY_FILE"
          echo "----- appcast.xml -----"; cat appcast.xml

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/OmniStats.dmg
            OmniStats.zip
            appcast.xml
          generate_release_notes: true

      - name: Remove signing keychain
        if: always()
        run: |
          if [ -n "${SIGN_KEYCHAIN:-}" ]; then security delete-keychain "$SIGN_KEYCHAIN" || true; fi
